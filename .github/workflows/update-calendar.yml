name: Update Astronomy Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Generate Calendar
        run: |
          python generate_calendar.py

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add docs/sky-events.ics

          git commit -m "Update astronomy calendar" || exit 0

          git push